<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PairDesk</title>
    <script>
      (function () {
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.add(dark ? 'dark' : 'light');
        document.documentElement.classList.add(dark ? 'pd-dark' : 'pd-light');
      })();
    </script>
    <style>
      html, body { background: #f4f5f7; color: #111318; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #0b0d10; color: #eef1f6; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
