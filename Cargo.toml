[workspace]
resolver = "2"

# 分层（依赖只能向内，详见 docs/architecture/clean-architecture.md）：
#   pairdesk-ui    GPUI 壳（适配器：只渲染 + 转发）
#   pairdesk-shell 领域层（业务规则，零 UI 依赖，全部可单测）
#   pairdesk-core  引擎层（协议/采集/编码/传输/注入）
#   pairdesk-relay 中继服务器（独立部署，不打包进客户端）
members = [
    "crates/pairdesk-core",
    "crates/pairdesk-relay",
    "crates/pairdesk-shell",
    "crates/pairdesk-ui",
]

# Release 优化：当前无任何配置，二进制含大量符号与未优化的跨 crate 调用。
# 实测（macOS arm64）：strip 单独省 3MB（22→19MB）。
[profile.release]
# 剥离符号表，安装包显著变小（不 strip 时 GPUI 版 24MB，比 Tauri 版 15MB 还大）
strip = true
# 单编译单元 + LTO：跨 crate 内联，体积与运行速度都更好；代价是编译变慢
lto = "thin"
codegen-units = 1
# 体积优先（不牺牲太多性能）
opt-level = "s"
panic = "abort"
