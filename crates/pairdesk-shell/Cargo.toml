[package]
name = "pairdesk-shell"
version = "0.1.21"
edition = "2021"
description = "PairDesk 应用层逻辑（UI 无关）：会话状态机 / 凭据生成 / 输入映射 / 更新检查 / 权限视图模型"

# 铁律：本 crate 不引用任何 UI 框架（Tauri / GPUI / 浏览器），
# 只依赖 pairdesk-core 的类型契约。上层（Tauri 壳 / GPUI 壳）都只是它的渲染器。
[dependencies]
pairdesk-core = { path = "../pairdesk-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
