# cargo-packager 配置 —— GPUI 壳的三平台安装包。
#
# 用法（在仓库根目录）：
#   cargo install cargo-packager --locked
#   cargo packager -p pairdesk-ui --config crates/pairdesk-ui/packager.toml
#
# 产物（由下方 [formats] 与各平台表共同决定）：
#   macOS   → PairDesk_<ver>_<arch>.dmg + PairDesk.app
#   Windows → PairDesk_<ver>_x64_en-US.msi
#   Linux   → PairDesk_<ver>_amd64.deb / .AppImage
#
# ⚠️ 格式必须与 pairdesk-shell::update::platform_asset_pattern 的匹配规则一致，
#    否则「检查更新」会找不到安装包、降级到 release 页面：
#      macOS → aarch64.dmg / x86_64.dmg
#      Windows → .msi   （不是 NSIS 的 setup.exe）
#      Linux → .AppImage

name = "PairDesk"
out_dir = "../../dist"
identifier = "com.pairdesk.app"
product_name = "PairDesk"

# 版本号：cargo-packager 不会自动读 Cargo.toml，必须显式给。
# CI 里由 `Sync version` 步骤用 awk 同步本文件与所有 Cargo.toml（见 .github/workflows/release.yml），
# 因此这里的值与 crate 版本始终一致。
version = "0.1.21"
description = "两人 P2P 远程协助"
authors = ["PairDesk"]
copyright = "Copyright © 2026 PairDesk"
homepage = "https://github.com/wmasfoe/pairdesk"

# 产物格式：必须显式声明，不能用 default。
#
# 原因：cargo-packager 的 default 在各平台包含多余格式——
#   - Linux 的 default 含 pacman（产出 tar.gz + PKGBUILD，不是安装包）
#   - Windows 的 default 含 nsis（产出 setup.exe）
# 而 pairdesk-shell::update::platform_asset_pattern 只认 .dmg / .msi / .AppImage，
# 多出来的格式会让「检查更新」匹配不到资产，且 release 里混入非安装包文件。
#
# 不适用当前平台的格式会被 cargo-packager 自动忽略，因此三平台可共用一份列表。
formats = ["app", "dmg", "wix", "deb", "appimage"]

# 二进制名与 Cargo.toml 的 [[bin]] name 一致。
# cargo-packager 默认从 out_dir 找二进制，这里显式指向 cargo 的产物目录。
binaries = [
  { path = "pairdesk-ui", main = true },
]
binaries_dir = "../../target/release"

icons = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/icon.icns",
  "icons/icon.ico",
]

[macos]
# 未签名分发：安装脚本会解除 quarantine
signing_identity = "-"
frameworks = []
minimum_system_version = "11.0"

# macOS 需要屏幕录制与辅助功能权限。
# cargo-packager 0.11 不支持内联 info_plist，需要用文件方式（见下）。
info_plist_path = "Info.plist"

[wix]
# 不签名（与现有发布流程一致）

[deb]
# Debian/Ubuntu 运行时依赖：Wayland/X11 + Vulkan + 字体
depends = [
  "libwayland-client0",
  "libxkbcommon0",
  "libxkbcommon-x11-0",
  "libfontconfig1",
  "libvulkan1",
]

[appimage]
# AppImage 默认行为即可
