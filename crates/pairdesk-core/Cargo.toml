[package]
name = "pairdesk-core"
version = "0.2.0"
edition = "2021"
description = "PairDesk 核心引擎:两人 P2P 远程协助的协议/采集/编码/注入/会话"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
rand = "0.8"
jpeg-encoder = "0.6"
# 网络异步运行时 + QUIC（打洞异网直连的传输基座）
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
quinn = { version = "0.11", features = ["rustls-ring"] }
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
futures = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }

# macOS 采集(core-graphics 截屏) + 注入(CGEvent)
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = { version = "0.24", features = ["highsierra"] }

# Windows 采集(GDI BitBlt) + 注入(SendInput)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
zune-jpeg = "0.4"

# ---- Examples ----
# paint 与 capture_probe 是纯 X11 工具（用 x11rb 直接操作 X server），
# 只在 Linux 上有意义。用 required-features 门控，这样 macOS/Windows 上
# `cargo check --all-targets` / `cargo test --all-targets` 不会尝试编译它们。
#
# 声明一个永不启用的 feature 作为门控开关：好处是不需要用户理解
# 「为什么这两个 example 没被编译」，也不会误把 x11rb 拉进非 Linux 构建。
[features]
x11-examples = []

[[example]]
name = "paint"
required-features = ["x11-examples"]

[[example]]
name = "capture_probe"
required-features = ["x11-examples"]
