[package]
name = "pairdesk-core"
version = "0.1.19"
edition = "2021"
description = "PairDesk 核心引擎:两人 P2P 远程协助的协议/采集/编码/注入/会话"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
rand = "0.8"
jpeg-encoder = "0.6"
# 网络异步运行时 + QUIC（打洞异网直连的传输基座）
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
quinn = { version = "0.11", features = ["rustls-ring"] }
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
futures = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }

# macOS 采集(core-graphics 截屏) + 注入(CGEvent)
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = { version = "0.24", features = ["highsierra"] }

# Windows 采集(GDI BitBlt) + 注入(SendInput)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
zune-jpeg = "0.4"