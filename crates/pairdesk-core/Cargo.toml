[package]
name = "pairdesk-core"
version = "0.1.0"
edition = "2021"
description = "PairDesk 核心引擎:两人 P2P 远程协助的协议/采集/编码/注入/会话"

[dependencies]
anyhow = "1"
chacha20poly1305 = "0.10"
sha2 = "0.10"
rand = "0.8"
jpeg-encoder = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }

[dev-dependencies]
zune-jpeg = "0.4"