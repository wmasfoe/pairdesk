[package]
name = "pairdesk-app"
version = "0.1.0"
description = "PairDesk 桌面壳（Tauri 2, 界面 + 内核粘合层）"
edition = "2021"

[lib]
name = "pairdesk_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
pairdesk-core = { path = "../pairdesk-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
