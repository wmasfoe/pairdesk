# PairDesk 三平台构建 + Release 发布
#
# 在真实的 Linux / macOS / Windows runner 上各自编译内核 + Tauri App + CLI
# （macOS/Windows 的"编译验证"由 CI 承担——本开发机是 Linux，无法本地编 mac/win）。
# 打 tag v* 时把产物发布到 GitHub Release。
#
# 注意边界：CI 是无头环境，能验证"编译 + 单元测试 + 打包"，
# 但真实"屏幕采集/输入注入"需要真实显示会话与系统权限，仍在真机手测。
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # publish 需要创建 GitHub Release / 上传 asset

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4

      # ---- Linux 系统依赖（Tauri webkit）----
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # ---- Rust ----
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # ---- Node + pnpm（前端）----
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      # 不缓存 app/node_modules：actions/cache@v4 在 Windows restore 缓存时会
      # 产出 realpath/EPERM 不可读的 node_modules（pnpm rebuild esbuild 与
      # vite build 均因 stat node_modules 失败），且是稳定复现、重跑无效。
      # 同一 HEAD 首个 push run 就是"全新 pnpm install(无缓存)"在三平台全绿，
      # 故去掉缓存、每次全新装依赖最可靠（多花几十秒，可接受）。

      # ---- 构建前端（产 app/dist）----
      - name: Install & build frontend
        run: |
          # pnpm 新版把"忽略依赖 build 脚本(esbuild)"当硬错误; || true 让 install 继续,
          # 随后 pnpm rebuild esbuild 强制装好二进制(跨 pnpm 版本最稳)
          pnpm install --frozen-lockfile || true
          pnpm rebuild esbuild
          cd app && pnpm build
        shell: bash

      # ---- 编译内核 + App + CLI（release）----
      - name: Compile (cargo release)
        run: cargo build --release --workspace
        shell: bash

      # ---- 单元测试（只测 lib，绕开 examples：它们在 mac/win 会用 Linux 专有的 x11rb）----
      - name: Unit tests
        run: cargo test --release --lib --workspace
        shell: bash

      # ---- Tauri bundle（打包成各平台安装包）----
      # 必须在 tauri 项目目录(crates/pairdesk-app,含 tauri.conf.json+Cargo.toml)跑;
      # tauri-cli 从 CWD 识别项目(在 app/ 会 panic "Couldn't recognize current folder")。
      - name: Tauri bundle
        run: |
          cd crates/pairdesk-app
          pnpm exec tauri build
        shell: bash

      # ---- 收集产物 ----
      - name: Collect CLI binaries
        run: |
          mkdir -p dist-cli
          cp target/release/pairdesk dist-cli/pairdesk-${{ runner.os }}-$(uname -m)${{ runner.os == 'Windows' && '.exe' || '' }}
          cp target/release/pairdesk-relay dist-cli/pairdesk-relay-${{ runner.os }}-$(uname -m)${{ runner.os == 'Windows' && '.exe' || '' }}
        shell: bash

      # ---- MUSL 全静态编译（仅 Linux）----
      # 产出不依赖 glibc 的静态二进制，任何 Linux(Debian12/13/Ubuntu/Alpine) 直接跑。
      # 用 cargo-zigbuild: 官方 RT 协调 Rust+zig 交叉到 x86_64-unknown-linux-musl,
      # 避免 zig cc 与 Rust musl self-contained crt 重复(_init/_start)的坑。
      - name: Build MUSL static CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          # cargo-zigbuild 交叉编译需要本机 zig 二进制作为 C 编译器/linker。
          # 不用 ziglang install.sh(路径不定), 直接下载确定版本到固定目录并导出 ZIG_TARGET。
          mkdir -p /tmp/zigset && cd /tmp/zigset
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar xf zig.tar.xz
          export PATH="/tmp/zigset/zig-linux-x86_64-0.13.0:$PATH"
          zig version
          # 回到仓库跟目录
          cd "$GITHUB_WORKSPACE"
          pipx install cargo-zigbuild
          export PATH="$HOME/.local/bin:$PATH"
          cargo zigbuild --release --target x86_64-unknown-linux-musl -p pairdesk-core
          cargo zigbuild --release --target x86_64-unknown-linux-musl -p pairdesk-relay
          mkdir -p dist-cli-musl
          cp target/x86_64-unknown-linux-musl/release/pairdesk dist-cli-musl/pairdesk-linux-x86_64-musl
          cp target/x86_64-unknown-linux-musl/release/pairdesk-relay dist-cli-musl/pairdesk-relay-linux-x86_64-musl
        shell: bash

      - name: Upload bundle & CLI
        uses: actions/upload-artifact@v4
        with:
          name: pairdesk-${{ matrix.os }}
          path: |
            dist-cli/*
            dist-cli-musl/*
            target/release/bundle/**
          if-no-files-found: warn


  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        run: |
          set -e
          # 只收集真正的安装包(.deb/.AppImage/.dmg/.msi)与 CLI(dist-cli/pairdesk*、dist-cli-musl/*)；
          # 若用 pairdesk-* 全匹配会误收 bundle 里 deb/AppImage 解压的中间文件(pairdesk-app.png、usr/bin/pairdesk-app)
          CLI=$(find artifacts -type f \( -path '*/dist-cli/pairdesk*' -o -path '*/dist-cli-musl/pairdesk*' \))
          PKG=$(find artifacts -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.appimage' -o -name '*.dmg' -o -name '*.pkg' -o -name '*.msi' -o -name '*.rpm' \))
          FILES=$(printf '%s\n%s\n' "$CLI" "$PKG" | sort -u)
          echo "发布文件:"; echo "$FILES"
          # publish job 未 checkout(无 .git)，必须显式 --repo，否则 gh 报 "not a git repository"
          if gh release view "$GITHUB_REF_NAME" --repo wmasfoe/pairdesk >/dev/null 2>&1; then
            # release 已存在：直接上传/覆盖资产（gh release edit 不接受文件参数）
            gh release upload "$GITHUB_REF_NAME" --repo wmasfoe/pairdesk --clobber $FILES
          else
            gh release create "$GITHUB_REF_NAME" --repo wmasfoe/pairdesk \
              --title "PairDesk $GITHUB_REF_NAME" \
              --generate-notes \
              $FILES
          fi
        env:
          GH_TOKEN: ${{ github.token }}
