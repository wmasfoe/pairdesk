# PairDesk 三平台构建 + Release 发布（GPUI 版）
#
# 在真实的 Linux / macOS / Windows runner 上各自编译 GPUI App + CLI，跑单测，产出安装包。
# 打 tag v* 时把产物发布到 GitHub Release。
#
# 为什么必须用真 runner 而不能本地交叉编译（实测结论，见 docs/architecture/gpui-constraints.md）：
#   - Linux：链接需要 xcb / xkbcommon / xkbcommon-x11 系统库，macOS 上没有
#   - Windows：gpui 的 build.rs 在 release 下硬依赖 fxc.exe（Windows SDK 提供）
#
# 边界：CI 能验证「编译 + 单测 + 打包」，但真实的屏幕采集/输入注入需要真实显示会话
# 与系统权限，仍在真机手测。
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  # PR 也要跑：这是三平台 GPUI 编译验证的唯一途径
  # （本机 macOS 无法交叉验证 Linux 的系统库与 Windows 的 fxc.exe）
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to build and publish (leave empty for build only)'
        required: false
        type: string

permissions:
  contents: write   # publish 需要创建 GitHub Release / 上传 asset

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      # ---- Linux 系统依赖（GPUI：Wayland/X11 + 字体 + Vulkan）----
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcb1-dev \
            libvulkan-dev libssl-dev

      # ---- Rust ----
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # ---- 依赖缓存 ----
      # 只缓存 cargo registry 与 target，不缓存任何 node_modules（已无前端）。
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ---- macOS: Metal 工具链 ----
      # Cargo.toml 已启用 gpui 的 runtime_shaders feature，shader 运行时编译，
      # 因此不强制需要 Metal Toolchain。此步仅作保险（失败不阻塞）。
      - name: Ensure Metal toolchain (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: xcodebuild -downloadComponent MetalToolchain

      # ---- 同步版本号（从 tag 提取，写入所有 crate 的 Cargo.toml）----
      - name: Sync version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          if [[ "$RELEASE_TAG" == v* ]]; then
            VER="${RELEASE_TAG#v}"
            echo "Syncing version to $VER"
            # 所有 crate 共用同一版本号（见 docs/architecture/crate-map.md）
            # 用 awk 只改第一处 version（跨 GNU/BSD sed 写法差异大，awk 最稳）
            # 范围：所有 crate 的 Cargo.toml + cargo-packager 配置（否则安装包名里的版本号对不上 tag）
            for f in crates/*/Cargo.toml crates/pairdesk-ui/packager.toml; do
              awk -v v="$VER" 'BEGIN{done=0} /^version = "/ && !done { sub(/"[^"]*"/, "\"" v "\""); done=1 } {print}' "$f" > "$f.tmp"
              mv "$f.tmp" "$f"
              echo "  $f -> $(grep -m1 '^version' "$f")"
            done
          else
            echo "Not a tag build, keeping Cargo.toml versions as-is"
          fi
        shell: bash

      # ---- 编译（release）----
      - name: Build
        run: cargo build --release --workspace
        shell: bash

      # ---- 单测（行为等价护栏，122 个）----
      - name: Unit tests
        run: cargo test --release --lib --workspace
        shell: bash

      # ---- 领域层与 UI 层单测（显式点名，确保不会被 --lib 过滤规则漏掉）----
      - name: Domain & UI tests
        run: |
          cargo test --release -p pairdesk-shell
          cargo test --release -p pairdesk-ui
        shell: bash

      # ---- 打包安装包（.dmg / .msi / .deb + .AppImage）----
      # PR 上跳过：打包耗时长且易受环境影响（如 macOS 的 Finder AppleScript），
      # PR 阶段的核心目的是验证「能编译 + 单测绿」。
      - name: Package
        if: github.event_name != 'pull_request'
        run: |
          cargo install cargo-packager --locked
          # 按平台指定格式：cargo-packager 不会忽略不适用当前平台的格式
          # （在 Windows 上传 app/dmg 会尝试创建 .app 目录并失败）。
          # 各平台格式必须与 pairdesk-shell::update::platform_asset_pattern 对齐。
          case "${{ runner.os }}" in
            macOS)   FORMATS="app,dmg" ;;
            Windows) FORMATS="wix" ;;
            Linux)   FORMATS="deb,appimage" ;;
            *)       echo "未知平台"; exit 1 ;;
          esac
          echo "打包格式: $FORMATS"
          cargo packager -p pairdesk-ui --config crates/pairdesk-ui/packager.toml --formats "$FORMATS"
        shell: bash

      # ---- 收集 CLI 二进制 ----
      - name: Collect CLI binaries
        run: |
          mkdir -p dist-cli
          EXT="${{ runner.os == 'Windows' && '.exe' || '' }}"
          ARCH="$(uname -m)"
          cp "target/release/pairdesk$EXT" "dist-cli/pairdesk-${{ runner.os }}-$ARCH$EXT"
          cp "target/release/pairdesk-relay$EXT" "dist-cli/pairdesk-relay-${{ runner.os }}-$ARCH$EXT"
        shell: bash

      # ---- MUSL 全静态编译（仅 Linux）----
      # 产出不依赖 glibc 的静态二进制，任何 Linux(Debian12/13/Ubuntu/Alpine) 直接跑。
      # 用 cargo-zigbuild: 官方 RT 协调 Rust+zig 交叉到 x86_64-unknown-linux-musl,
      # 避免 zig cc 与 Rust musl self-contained crt 重复(_init/_start)的坑。
      - name: Build MUSL static CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          # cargo-zigbuild 交叉编译需要本机 zig 二进制作为 C 编译器/linker。
          # 不用 ziglang install.sh(路径不定), 直接下载确定版本到固定目录并导出 PATH。
          mkdir -p /tmp/zigset && cd /tmp/zigset
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar xf zig.tar.xz
          export PATH="/tmp/zigset/zig-linux-x86_64-0.13.0:$PATH"
          zig version
          cd "$GITHUB_WORKSPACE"
          pipx install cargo-zigbuild
          export PATH="$HOME/.local/bin:$PATH"
          cargo zigbuild --release --target x86_64-unknown-linux-musl -p pairdesk-core
          cargo zigbuild --release --target x86_64-unknown-linux-musl -p pairdesk-relay
          mkdir -p dist-cli-musl
          cp target/x86_64-unknown-linux-musl/release/pairdesk dist-cli-musl/pairdesk-linux-x86_64-musl
          cp target/x86_64-unknown-linux-musl/release/pairdesk-relay dist-cli-musl/pairdesk-relay-linux-x86_64-musl
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pairdesk-${{ matrix.os }}
          path: |
            dist-cli/*
            dist-cli-musl/*
            dist/*
          if-no-files-found: warn

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        run: |
          set -e
          # CLI：dist-cli / dist-cli-musl 下的二进制
          CLI=$(find artifacts -type f \( -path '*/dist-cli/pairdesk*' -o -path '*/dist-cli-musl/pairdesk*' \))
          # 安装包：cargo-packager 产出的 .dmg / .msi / .exe / .deb / .AppImage / .rpm
          PKG=$(find artifacts -type f \( \
            -name '*.dmg' -o -name '*.pkg' -o \
            -name '*.msi' -o -name '*.exe' -o \
            -name '*.deb' -o -name '*.rpm' -o \
            -name '*.AppImage' -o -name '*.appimage' \))
          FILES=$(printf '%s\n%s\n' "$CLI" "$PKG" | sort -u)
          if [ -z "$FILES" ]; then
            echo "❌ 没有可发布的产物"
            exit 1
          fi
          echo "发布文件:"; echo "$FILES"
          # publish job 未 checkout(无 .git)，必须显式 --repo，否则 gh 报 "not a git repository"
          if gh release view "$RELEASE_TAG" --repo wmasfoe/pairdesk >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo wmasfoe/pairdesk --clobber $FILES
          else
            gh release create "$RELEASE_TAG" --repo wmasfoe/pairdesk \
              --title "PairDesk $RELEASE_TAG" \
              --verify-tag --generate-notes \
              $FILES
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
